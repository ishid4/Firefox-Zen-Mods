# A touch published from Firefox-Zen (an issue with the touch in it) ->
# checked -> touches/<issue>.json committed to main, no pull request.
# Editing the issue updates it; closing it removes it. See scripts/touches.mjs.
name: Touches

on:
  issues:
    types: [opened, edited, reopened, closed]

permissions:
  contents: write
  issues: write
  actions: write

# One at a time, so two touches never push over each other.
concurrency:
  group: touches
  cancel-in-progress: false

jobs:
  touch:
    if: contains(github.event.issue.body, '<!-- firefox-zen-touch -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the touch
        id: touch
        run: node scripts/touches.mjs
        env:
          # The issue (untrusted) is read from the event file by the script,
          # never put in a shell command.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

      - name: Commit and republish
        if: steps.touch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A touches
          git commit -q -m "Touch #$NUMBER"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          # Pushes with this token don't start workflows: run Publish directly.
          gh workflow run publish.yml --ref main
